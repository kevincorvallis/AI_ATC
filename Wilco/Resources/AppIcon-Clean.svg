<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with iOS-style rounded corners -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Subtle radial highlight -->
  <ellipse cx="400" cy="350" rx="400" ry="300" fill="white" opacity="0.03"/>

  <!-- Radio waves (left side) - centered on tower -->
  <g transform="translate(512, 420)">
    <!-- Outer wave -->
    <path d="M -220 -150 Q -350 0 -220 150"
          fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" opacity="0.4"/>
    <!-- Middle wave -->
    <path d="M -150 -100 Q -240 0 -150 100"
          fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" opacity="0.55"/>
    <!-- Inner wave -->
    <path d="M -85 -55 Q -140 0 -85 55"
          fill="none" stroke="#60a5fa" stroke-width="28" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Radio waves (right side) -->
  <g transform="translate(512, 420)">
    <!-- Outer wave -->
    <path d="M 220 -150 Q 350 0 220 150"
          fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" opacity="0.4"/>
    <!-- Middle wave -->
    <path d="M 150 -100 Q 240 0 150 100"
          fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" opacity="0.55"/>
    <!-- Inner wave -->
    <path d="M 85 -55 Q 140 0 85 55"
          fill="none" stroke="#60a5fa" stroke-width="28" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Control Tower -->
  <g>
    <!-- Tower base/body - tapered -->
    <path d="M 470 520 L 445 820 L 579 820 L 554 520 Z"
          fill="#1e40af"/>

    <!-- Tower support struts -->
    <line x1="458" y1="670" x2="490" y2="670" stroke="#3b82f6" stroke-width="8"/>
    <line x1="534" y1="670" x2="566" y2="670" stroke="#3b82f6" stroke-width="8"/>

    <!-- Tower cab (control room) -->
    <rect x="420" y="380" width="184" height="140" rx="12" fill="url(#accentGrad)"/>

    <!-- Cab top trim -->
    <rect x="420" y="380" width="184" height="20" rx="12" fill="#60a5fa"/>

    <!-- Main window (dark) -->
    <rect x="440" y="410" width="144" height="70" rx="6" fill="#0f172a" opacity="0.7"/>

    <!-- Window shine/reflection -->
    <rect x="448" y="418" width="60" height="54" rx="4" fill="#60a5fa" opacity="0.25"/>

    <!-- Antenna mast -->
    <rect x="500" y="280" width="24" height="100" rx="4" fill="url(#accentGrad)"/>

    <!-- Antenna platform -->
    <rect x="485" y="310" width="54" height="12" rx="3" fill="#60a5fa"/>

    <!-- Antenna top sphere -->
    <circle cx="512" cy="255" r="32" fill="url(#accentGrad)"/>

    <!-- Beacon light (red, glowing) -->
    <circle cx="512" cy="255" r="18" fill="#ef4444" filter="url(#glowFilter)"/>
    <circle cx="512" cy="255" r="10" fill="#fca5a5"/>
  </g>

  <!-- Small airplane silhouette -->
  <g transform="translate(720, 280) rotate(20) scale(1.3)">
    <path d="M 0 0
             L 70 -6
             L 88 -8
             L 92 -5
             L 88 -2
             L 50 2
             L 58 18
             L 48 16
             L 42 5
             L 15 8
             L 18 22
             L 10 20
             L 4 7
             L -15 9
             L -18 5
             L 0 0 Z"
          fill="white" opacity="0.95"/>
  </g>
</svg>
